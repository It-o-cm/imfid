# =====================================================================
# imfid — loyalty application of the Intermarché sandbox ecosystem.
# Quarkus, root package com.intermarche.fidelity. See docs/ (spec v1.16).
# =====================================================================

# ---------------------------------------------------------------------
# HTTP server — dedicated port 8060 (§24.5).
# ---------------------------------------------------------------------
quarkus.http.port=8060

# ---------------------------------------------------------------------
# Datasource — PostgreSQL in production, H2 in tests (§24.5).
# Both JDBC drivers are on the classpath; the active kind is selected per
# profile. Dev and test run on an in-memory H2 for convenience; production
# reads its connection from the environment so no credential is versioned.
# ---------------------------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.username=username
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:h2:mem:imfid;DB_CLOSE_DELAY=-1

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${IMFID_DB_USERNAME}
%prod.quarkus.datasource.password=${IMFID_DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${IMFID_DB_URL}

# ---------------------------------------------------------------------
# Hibernate ORM — drop-and-create on the ephemeral H2 of dev/test; on the
# production PostgreSQL, never drop: reconcile the schema without data loss.
# ---------------------------------------------------------------------
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
%prod.quarkus.hibernate-orm.database.generation=update

# Bulk CSV imports rely on batched, ordered statements (§ imports, checksum
# staged fallback 1000->100->10->1).
quarkus.hibernate-orm.jdbc.batch_size=1000
quarkus.hibernate-orm.jdbc.order_inserts=true
quarkus.hibernate-orm.jdbc.order_updates=true

# ---------------------------------------------------------------------
# Health — GET /q/health (SmallRye Health, §24). impos probes it to detect
# the degraded mode (§31.4): earn hidden, burn refused, events deferred.
# ---------------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health

# ---------------------------------------------------------------------
# Runtime — virtual threads (Project Loom), as in imvaluation.
# ---------------------------------------------------------------------
quarkus.threading.virtual.enabled=true

# ---------------------------------------------------------------------
# Logging — JBoss log manager (no System.out anywhere in the code).
# ---------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."com.intermarche".level=DEBUG
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG

# ---------------------------------------------------------------------
# Program reference time zone (§25.1) — Europe/Paris defines the fiscal day
# for visits (I3), the 28th, the 1st-March expiry and rule windows; never
# the server clock (§24.6, §30.3). Promoted to an administrable
# FidelityProgramSetting when the settings entity lands; this is the seed
# default until then.
# ---------------------------------------------------------------------
imfid.program.zone=Europe/Paris

# ---------------------------------------------------------------------
# Authentication and roles (§24.1) — two surfaces, two roles:
#   - HTTP Basic for the machine clients: POS API (/api/*, role pos),
#     CSV imports and GraphQL (role fid-admin);
#   - form login for the admin UI browser (role fid-admin).
# Accounts are DB-backed @UserDefinition (AppUser), bcrypt hashes; the role
# annotations on the resources are the authoritative guard (§21.4), the path
# policies below only pick the mechanism.
# ---------------------------------------------------------------------
quarkus.http.auth.basic=true
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/ui/login
quarkus.http.auth.form.error-page=/ui/login?error=true
quarkus.http.auth.form.landing-page=/ui/cards
quarkus.http.auth.form.post-location=/j_security_check
quarkus.http.auth.form.username-parameter=j_username
quarkus.http.auth.form.password-parameter=j_password

%dev.quarkus.http.auth.session.encryption-key=dev-only-not-for-production-0123456789abcdef
%test.quarkus.http.auth.session.encryption-key=test-only-not-for-production-0123456789abcd
%prod.quarkus.http.auth.session.encryption-key=${IMFID_SESSION_KEY}

# Forced password change (§24.1): an operator flagged mustChangePassword (created or reset
# by an administrator, or the bootstrap admin) is confined to /ui/password until they choose
# their own password (PasswordChangeFilter). Relaxed in dev/test so the seeded accounts stay
# directly usable while developing; only browser navigation is ever redirected.
imfid.password-change.enforced=true
%dev.imfid.password-change.enforced=false
%test.imfid.password-change.enforced=false

# Public paths (no authentication): the health probe, the login page + its stylesheet,
# and the self-service password-reset pages (§24.1).
quarkus.http.auth.permission.public.paths=/q/health,/q/health/*,/ui/login,/ui/forgot,/ui/reset,/ui/base.css
quarkus.http.auth.permission.public.policy=permit

# POS API authenticates via HTTP Basic; the resource @RolesAllowed enforces pos/fid-admin.
quarkus.http.auth.permission.api.paths=/api/*,/graphql,/graphql/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.api.auth-mechanism=basic

# CSV import endpoints require the fid-admin role, enforced server-side by this named
# policy (machine endpoints; the in-process seed loader bypasses HTTP policies, §24.4).
quarkus.http.auth.policy.fid-admin-policy.roles-allowed=fid-admin
quarkus.http.auth.permission.imports.paths=/products/import,/product-families/import,/fidelity/*
quarkus.http.auth.permission.imports.policy=fid-admin-policy
quarkus.http.auth.permission.imports.auth-mechanism=basic

# ---------------------------------------------------------------------
# Bootstrap operator accounts (§24.1) — seeded when app_users is empty.
# Passwords come from the environment in production; nothing is versioned.
# The admin address receives the password-reset links; the pos machine
# account has none on purpose (no self-service reset for machines).
# ---------------------------------------------------------------------
imfid.bootstrap.pos.username=pos
imfid.bootstrap.admin.username=admin
imfid.bootstrap.admin.email=admin@imfid.local
%prod.imfid.bootstrap.pos.password=${IMFID_POS_PASSWORD}
%prod.imfid.bootstrap.admin.password=${IMFID_ADMIN_PASSWORD}
%prod.imfid.bootstrap.admin.email=${IMFID_ADMIN_EMAIL}

# ---------------------------------------------------------------------
# Password-reset e-mails (§24.1). Outside production the mailer is mocked
# by default: the mail — and thus the reset link — is written to the log,
# so the whole flow is testable in dev without any SMTP server. Production
# reads its SMTP connection from the environment.
# ---------------------------------------------------------------------
imfid.reset.token-ttl-minutes=30
quarkus.mailer.from=no-reply@imfid.local
%prod.quarkus.mailer.from=${IMFID_MAIL_FROM}
%prod.quarkus.mailer.host=${IMFID_SMTP_HOST}
%prod.quarkus.mailer.port=${IMFID_SMTP_PORT}
%prod.quarkus.mailer.username=${IMFID_SMTP_USERNAME}
%prod.quarkus.mailer.password=${IMFID_SMTP_PASSWORD}
%prod.quarkus.mailer.tls=true
