<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{#if forced}Choisir un mot de passe{#else}Changer de mot de passe{/if} — Fidélité admin</title>
    <link rel="stylesheet" href="/ui/base.css">
    <link rel="stylesheet" href="/ui/auth.css">
</head>
<body class="login-body">
<main class="login-panel">
    <div class="login-brand">
        <span class="app-brand-mark"></span>
        <span class="app-brand-text">Fidélité<b>admin</b></span>
    </div>

    {#if forced}
    <div class="alert alert-ok" role="status">Choisissez votre propre mot de passe avant d'accéder à l'administration.</div>
    {/if}
    {#if error}
    <div class="alert alert-error" role="alert">{error}</div>
    {/if}

    <form class="login-form" method="post" action="/ui/password">
        {#if !forced}
        <label class="field">
            <span class="field-label">Mot de passe actuel</span>
            <input type="password" name="currentPassword" autocomplete="current-password" required autofocus>
        </label>
        {/if}

        <label class="field">
            <span class="field-label">Nouveau mot de passe (8 caractères minimum)</span>
            <input type="password" name="newPassword" autocomplete="new-password" minlength="8" required {#if forced}autofocus{/if}>
        </label>

        <label class="field">
            <span class="field-label">Confirmez le nouveau mot de passe</span>
            <input type="password" name="confirmation" autocomplete="new-password" required>
        </label>

        <button class="btn btn-primary login-submit" type="submit">Mettre à jour le mot de passe</button>
    </form>

    {#if !forced}
    <p class="field-hint" style="margin-top:14px;text-align:center">
        <a href="/ui/cards">← Retour à l'administration</a>
    </p>
    {/if}
</main>
</body>
</html>
