<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion — Fidélité admin</title>
    <link rel="stylesheet" href="/ui/base.css">
    <link rel="stylesheet" href="/ui/auth.css">
</head>
<body class="login-body">
<main class="login-panel">
    <div class="login-brand">
        <span class="app-brand-mark"></span>
        <span class="app-brand-text">Fidélité<b>admin</b></span>
    </div>

    {#if error}
    <div class="alert alert-error" role="alert">Identifiants invalides.</div>
    {/if}
    {#if reset}
    <div class="alert alert-ok" role="alert">Votre mot de passe a été modifié. Vous pouvez vous connecter.</div>
    {/if}

    <form class="login-form" method="post" action="/j_security_check">
        <label class="field">
            <span class="field-label">Identifiant</span>
            <input type="text" name="j_username" autocomplete="username" required autofocus>
        </label>

        <label class="field">
            <span class="field-label">Mot de passe</span>
            <input type="password" name="j_password" autocomplete="current-password" required>
        </label>

        <button class="btn btn-primary login-submit" type="submit">Se connecter</button>
    </form>

    <p class="field-hint" style="margin-top:14px;text-align:center">
        <a href="/ui/forgot">Mot de passe oublié ?</a>
    </p>
</main>
</body>
</html>
